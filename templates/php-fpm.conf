[{{fqdn}}]

 listen = /var/run/php/{{fqdn}}.sock
 listen.backlog = 511
 listen.owner = {{web_user}}
 listen.group = {{web_user}}
 listen.mode = 0660

 user = {{web_user}}
 group = {{web_user}}

 pm = ondemand
 pm.max_children = 10
 pm.process_idle_timeout = 10
 pm.max_requests = 0
 chdir = /

 request_terminate_timeout = 600